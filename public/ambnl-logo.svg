<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <!-- Sharp clips and paths matching official logo geometry -->
    <clipPath id="ambnl-frame">
      <rect width="400" height="350" rx="4" />
    </clipPath>
  </defs>
  
  <g clip-path="url(#ambnl-frame)">
    <!-- Red Top-Left Segment -->
    <polygon points="0,0 240,0 0,265" fill="#D32027" />
    
    <!-- Navy Blue Bottom-Right Segment -->
    <polygon points="120,80 360,80 360,340 115,340" fill="#1E2756" />
    
    <!-- White S-Curved Oval Band -->
    <path d="M 105,75 C 180,60 260,115 275,170 C 290,225 210,270 115,340 C 255,270 290,190 270,120 C 250,55 170,40 95,85 Z" fill="#FFFFFF" />
    <!-- Core white ellipse overlay for the lettering path -->
    <ellipse cx="180" cy="175" rx="100" ry="42" transform="rotate(-40 180 175)" fill="#FFFFFF" />
    
    <!-- Top-left white corner trim -->
    <polygon points="0,265 0,350 250,350 250,265" fill="#FFFFFF" opacity="0.95" />
    <polygon points="240,0 400,0 400,80" fill="#FFFFFF" opacity="0.95" />
    
    <!-- Diagonal Brand Lettering A.M.B.N.L -->
    <text x="180" y="185" 
          font-family="'Barlow', 'Arial Black', sans-serif" 
          font-size="34" 
          font-weight="900" 
          fill="#1E5FA8" 
          text-anchor="middle" 
          letter-spacing="2" 
          transform="rotate(-40 180 185)">
      A.M.B.N.L
    </text>
  </g>
</svg>
